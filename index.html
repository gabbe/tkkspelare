<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Körspelare</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;display:grid;grid-template-columns:320px 1fr;height:100vh}
#side{padding:12px;border-right:1px solid #ccc;overflow:auto;font-size:14px}
#main{overflow:auto;position:relative}
.track,.panel{border:1px solid #ddd;padding:6px;margin:6px 0;border-radius:6px}
.track b{display:block}
button{margin:2px;border:1px solid #999;background:#f4f4f4;border-radius:4px;padding:2px 8px;cursor:pointer}
button.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
button.mark{background:#fff3c4;border-color:#d8b64a}
.at-cursor-bar{background:rgba(255,242,0,.25)}
.at-selection div{background:rgba(64,64,255,.1)}
.at-cursor-beat{background:rgba(64,64,255,.75);width:3px}
.at-highlight *{fill:#0078ff;stroke:#0078ff}
label{display:block;margin:4px 0}
#summary{background:#eef;padding:6px;border-radius:6px;margin:6px 0;min-height:2.5em}
</style></head><body>
<div id="side">
<h3 id="heading"></h3>
<label><span data-t="file"></span>
<select id="file" style="max-width:290px"></select></label>
<div><button id="play">▶ / ❚❚</button><button id="stop">■</button>
<label><input type="checkbox" id="loop"> <span data-t="loop"></span></label>
<label><input type="checkbox" id="linear"> <span data-t="linear"></span></label>
<label><input type="checkbox" id="metro"> <span data-t="metronome"></span></label></div>
<label><span data-t="tempo"></span> <span id="speedv">100</span>% <button id="speedreset">100%</button>
<input type="range" id="speed" min="40" max="200" value="100"></label>
<label><span data-t="preset"></span>
<select id="preset"></select></label>
<div id="summary"></div>
<div id="bookmarks" class="panel"><b data-t="bookmarksHeading"></b><div id="bmlist"></div>
<button id="bmadd"></button> <button id="report" hidden></button></div>
<div id="tracks"></div>
<p id="status"></p>
<p data-t="keysHint" style="font-size:11px;color:#666"></p>
<pre id="notes" style="white-space:pre-wrap;font-size:11px;color:#666"></pre>
</div>
<div id="main"><div id="at"></div></div>
<!-- Locally patched alphaTab (repeats before jumps), see patch_alphatab.py -->
<script src="vendor/alphaTab.js"></script>
<script>
// ---- UI strings (Swedish; the choir's language). Everything the user sees is here. ----
const T={
 heading:'Körspelare', file:'Fil:', loop:'Loopa markerat område (dra över takter)',
 linear:'Spela utan repriser och hopp', metronome:'Metronom', tempo:'Tempo:', preset:'Instrument:',
 loading:'laddar…', loaded:(title,n)=>`Laddad: ${title||'(ingen titel)'} – ${n} stämmor`, audioReady:' – ljud klart',
 error:'FEL: ', part:i=>`Stämma ${i}`, solo:'Solo', mute:'Tyst', focus:'Dämpa övriga till 25%',
 pan:'Pan:', left:'Vänster', center:'Mitt', right:'Höger', volume:'Volym',
 sumSolo:'Solo: ', sumMute:'Tyst: ', sumDamped:'Dämpat: ', sumPan:'Pan: ', panLeft:'vänster', panRight:'höger',
 sumNeutral:'Alla stämmor hörs lika, i mitten.',
 presets:[['','(som i filen)'],['0','Piano'],['52','Kör (aahs)'],['53','Röst (oohs)'],['19','Kyrkorgel'],['73','Flöjt'],['48','Stråkar']],
 rootFolder:'Övrigt', fixtureFolder:'Test', notesHeading:'Anmärkningar från förberedningen (för digitaliserarna):',
 bookmarksHeading:'Bokmärken', rehearsalMark:(bar,name)=>`${name} (takt ${bar})`, bookmarkAdd:bar=>`Bokmärk takt ${bar}`,
 keysHint:'Tangenter: mellanslag spela/pausa · ← → takt · Home början', bookmarkName:bar=>`Namn på bokmärket (takt ${bar}):`, bookmarkRemove:'ta bort',
 report:bar=>`Rapportera fel i takt ${bar}`, reportEmail:'gabriel_tkkspelare@thornblad.com',
 reportSubject:(title,bar)=>`Notfel: ${title}, takt ${bar}`,
 reportBody:(title,bar,file,mixer)=>`Sång: ${title}\nTakt: ${bar}\nFil: ${file}\nMixer: ${mixer}\n\nVad är fel (stämma, ton, text, rytm ...)?\n\n`,
 fixture:[{title:'Testsång (fixtur: repris, D.C. al Coda, divisi)',file:'test/fixture-prepared.mxl'},
          {title:'Testsång, oförberedd export (S/A + T/B)',file:'test/fixture.mxl'}]
};
const $=s=>document.querySelector(s);
$('#heading').textContent=T.heading; $('#status').textContent=T.loading;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t]);
T.presets.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;$('#preset').appendChild(o);});

const main=$('#main');
// Everything alphaTab needs is served from vendor/ (see patch_alphatab.py); no CDN at runtime.
const settings={
 core:{scriptFile:new URL('vendor/alphaTab.js',location.href).href,fontDirectory:new URL('vendor/font/',location.href).href},
 player:{enablePlayer:true,enableCursor:true,enableUserInteraction:true,soundFont:new URL('vendor/soundfont/sonivox.sf3',location.href).href,scrollElement:main},
 display:{layoutMode:'page',scale:0.9}
};
const api=new alphaTab.AlphaTabApi($('#at'),settings);
let score=null;
// Mixer state lives here, not in the synth: alphaTab re-applies its own idea of the
// volumes every time the MIDI is regenerated (instrument or pan change).
let mix={vol:[],mute:[],solo:[],pan:[]};

function fixJumps(s){
 // MuseScore writes "D.C." and "To Coda" as separate marks. alphaTab imports them as
 // plain DaCapo + DaCoda, which replays to the end. Turn them into the "al Coda" jump.
 const D=alphaTab.model.Direction;
 const all=new Set(); s.masterBars.forEach(m=>m.directions&&m.directions.forEach(d=>all.add(d)));
 const hasCoda=all.has(D.JumpDaCoda), hasFine=all.has(D.TargetFine);
 const swap=(from,alCoda,alFine)=>s.masterBars.forEach(m=>{ if(m.directions&&m.directions.has(from)){ m.directions.delete(from); m.directions.add(hasCoda?alCoda:hasFine?alFine:from);} });
 swap(D.JumpDaCapo,D.JumpDaCapoAlCoda,D.JumpDaCapoAlFine);
 swap(D.JumpDalSegno,D.JumpDalSegnoAlCoda,D.JumpDalSegnoAlFine);
}
function trackNamesOnEverySystem(s){
 // full part names on the first system, short names (S, A, T, B1 ...) on every other.
 // These are properties of the score's stylesheet, not of the settings.
 const M=alphaTab.model; const ss=s.stylesheet;
 ss.multiTrackTrackNamePolicy=M.TrackNamePolicy.AllSystems; ss.singleTrackTrackNamePolicy=M.TrackNamePolicy.AllSystems;
 ss.firstSystemTrackNameMode=M.TrackNameMode.FullName; ss.otherSystemsTrackNameMode=M.TrackNameMode.ShortName;
}
api.scoreLoaded.on(s=>{
 score=s; saved=null; fixJumps(s); trackNamesOnEverySystem(s);
 mix={vol:s.tracks.map(()=>1),mute:s.tracks.map(()=>false),solo:s.tracks.map(()=>false),pan:s.tracks.map(()=>8)};
 api.renderTracks(s.tracks); renderTracks();
 currentFile=$('#file').value||currentFile; paintBookmarks();
 loadedText=T.loaded(s.title,s.tracks.length); $('#status').textContent=loadedText;
 if($('#linear').checked) setLinear(true);
});
let loadedText='';
// Must be registered before the first load: registering later hits an alphaTab bug
// (infinite recursion in the loadedMidiInfo getter of the worker proxy).
api.midiLoaded.on(()=>applyMix());
api.playerReady.on(()=>$('#status').textContent=loadedText+T.audioReady);
api.error.on(e=>{$('#status').textContent=T.error+e.message;console.error(e)});
api.playerPositionChanged.on(e=>{const p=$('#pos'); if(p) p.textContent=Math.round(e.currentTime/1000)+'s / '+Math.round(e.endTime/1000)+'s'});

$('#file').onchange=e=>api.load(e.target.value);
// Library: library.json (written by sync.py, git-ignored) lists {title, file, folder,
// current, warnings}. Grouped by folder, current repertoire first. Without a library
// the bundled test fixture is shown.
fetch('library.json').then(r=>r.ok?r.json():[]).catch(()=>[]).then(lib=>{
 const items=lib.concat(T.fixture.map(f=>({...f,folder:T.fixtureFolder}))); const sel=$('#file');
 const groups=new Map();
 items.forEach(it=>{const g=it.folder||T.rootFolder; if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(it);});
 groups.forEach((list,g)=>{const og=document.createElement('optgroup'); og.label=g;
  list.forEach(it=>{const o=document.createElement('option');o.value=it.file;o.textContent=it.title+(it.warnings&&it.warnings.length?' ⚠':'');o.title=(it.warnings||[]).join('\n');og.appendChild(o);});
  sel.appendChild(og);});
 window.libraryItems=items;
 currentFile=items[0].file; api.load(items[0].file);
});
$('#file').addEventListener('change',e=>{const it=(window.libraryItems||[]).find(i=>i.file===e.target.value); $('#notes').textContent=it&&it.warnings&&it.warnings.length?T.notesHeading+'\n'+it.warnings.join('\n'):'';});
$('#play').onclick=()=>api.playPause();
$('#stop').onclick=()=>api.stop();
$('#loop').onchange=e=>{api.isLooping=e.target.checked; if(e.target.checked){$('#linear').checked=true;} setLinear($('#linear').checked);};
$('#linear').onchange=e=>setLinear(e.target.checked);
$('#metro').onchange=e=>api.metronomeVolume=e.target.checked?1:0;
const setSpeed=v=>{api.playbackSpeed=v/100;$('#speed').value=v;$('#speedv').textContent=v};
$('#speed').oninput=e=>setSpeed(+e.target.value);
$('#speedreset').onclick=()=>setSpeed(100);
$('#preset').onchange=e=>{
 if(e.target.value==='')return; const prog=+e.target.value; const AT=alphaTab.model.AutomationType;
 score.tracks.forEach(t=>{t.playbackInfo.program=prog;
  // The importer also stores the file's instrument as a beat automation, which
  // overrides playbackInfo.program at tick 0, so update those too.
  t.staves.forEach(st=>st.bars.forEach(b=>b.voices.forEach(v=>v.beats.forEach(bt=>bt.automations.forEach(a=>{if(a.type===AT.Instrument)a.value=prog;})))))});
 regenerate();
};

function regenerate(){
 // playbackInfo.volume is used twice by alphaTab: as MIDI channel volume when the
 // file is generated, and as mixer volume re-applied in readyForPlayback after every
 // MIDI load (which runs after midiLoaded and would undo applyMix). Generate with
 // full channel volume, then let readyForPlayback apply the mixer level.
 score.tracks.forEach((t,i)=>{t.playbackInfo.balance=mix.pan[i];t.playbackInfo.volume=16;t.playbackInfo.isMute=mix.mute[i];t.playbackInfo.isSolo=mix.solo[i];});
 const range=currentRangeBars();
 api.loadMidiForScore();
 score.tracks.forEach((t,i)=>t.playbackInfo.volume=Math.round(mix.vol[i]*16));
 if(range) setRangeBars(range);
}
function applyMix(){
 score.tracks.forEach((t,i)=>{t.playbackInfo.volume=Math.round(mix.vol[i]*16);t.playbackInfo.isMute=mix.mute[i];t.playbackInfo.isSolo=mix.solo[i];
  api.changeTrackVolume([t],mix.vol[i]);api.changeTrackMute([t],mix.mute[i]);api.changeTrackSolo([t],mix.solo[i]);});
 paint();
}

// ---- Linear mode: play without repeats and jumps (used while looping a selection) ----
let saved=null;
function setLinear(on){
 if(on&&!saved){
  saved=score.masterBars.map(m=>({rc:m.repeatCount,rs:m.isRepeatStart,ae:m.alternateEndings,dir:m.directions?new Set(m.directions):null}));
  score.masterBars.forEach(m=>{m.repeatCount=0;m.isRepeatStart=false;m.alternateEndings=0;m.directions=null;});
  regenerate();
 } else if(!on&&saved){
  score.masterBars.forEach((m,i)=>{const s=saved[i];m.repeatCount=s.rc;m.isRepeatStart=s.rs;m.alternateEndings=s.ae;m.directions=s.dir;});
  saved=null; regenerate();
 }
}
// A playback range is stored in ticks, which move when repeats are switched on or
// off. Remember it as bars + offsets and re-map after the MIDI is regenerated.
function barAt(tick){
 const mbs=api.tickCache.masterBars; let hit=null;
 for(const m of mbs){ if(tick>=m.start&&tick<m.end){hit=m;break;} }
 if(!hit) hit=mbs[mbs.length-1];
 return {index:hit.masterBar.index,offset:tick-hit.start};
}
function currentRangeBars(){
 const r=api.playbackRange; if(!r) return null;
 return {start:barAt(r.startTick),end:barAt(r.endTick-1)};
}
function setRangeBars(range){
 const first=i=>api.tickCache.masterBars.find(m=>m.masterBar.index===i);
 const s=first(range.start.index), e=first(range.end.index); if(!s||!e) return;
 api.playbackRange={startTick:s.start+range.start.offset,endTick:e.start+range.end.offset+1};
}

// ---- Bookmarks (per song, in this browser) and error report (mail to the digitisers) ----
let currentFile='';
function currentBar(){
 // playback position -> printed bar number (first occurrence wins when a bar repeats)
 const t=api.tickPosition; const mbs=api.tickCache?api.tickCache.masterBars:[];
 const hit=mbs.find(m=>t>=m.start&&t<m.end)||mbs[0]; return hit?hit.masterBar.index+1:1;
}
function gotoBar(bar){
 if(!api.tickCache) return;
 const m=api.tickCache.masterBars.find(x=>x.masterBar.index===bar-1); if(m){api.tickPosition=m.start; api.scrollToCursor();}
}
const bmKey=()=>'korspelare.bookmarks.'+currentFile;
function bookmarks(){ try{return JSON.parse(localStorage.getItem(bmKey())||'[]');}catch(e){return [];} }
function saveBookmarks(list){ try{localStorage.setItem(bmKey(),JSON.stringify(list));}catch(e){} paintBookmarks(); }
function rehearsalMarks(){
 // MusicXML <rehearsal> marks arrive as section markers on the master bars
 if(!score) return [];
 return score.masterBars.filter(m=>m.section&&m.section.marker).map(m=>({bar:m.index+1,name:m.section.marker}));
}
function paintBookmarks(){
 const box=$('#bmlist'); box.innerHTML='';
 const marks=rehearsalMarks();
 if(marks.length){
  const row=document.createElement('div');
  marks.forEach(m=>{const go=document.createElement('button'); go.textContent=T.rehearsalMark(m.bar,m.name); go.className='mark'; go.onclick=()=>gotoBar(m.bar); row.appendChild(go);});
  box.appendChild(row);
 }
 bookmarks().sort((a,b)=>a.bar-b.bar).forEach(b=>{
  const row=document.createElement('div');
  const go=document.createElement('button'); go.textContent=`${b.bar}: ${b.name}`; go.onclick=()=>gotoBar(b.bar);
  const rm=document.createElement('button'); rm.textContent='×'; rm.title=T.bookmarkRemove; rm.onclick=()=>saveBookmarks(bookmarks().filter(x=>x.bar!==b.bar));
  row.appendChild(go); row.appendChild(rm); box.appendChild(row);
 });
 $('#bmadd').textContent=T.bookmarkAdd(currentBar());
 $('#report').textContent=T.report(currentBar()); $('#report').hidden=!T.reportEmail;
}
$('#bmadd').onclick=()=>{const bar=currentBar(); const name=prompt(T.bookmarkName(bar), ''); if(name===null) return;
 saveBookmarks(bookmarks().filter(x=>x.bar!==bar).concat([{bar,name:name||''}]));};
$('#report').onclick=()=>{const bar=currentBar(); const title=score&&score.title||currentFile;
 const url='mailto:'+T.reportEmail+'?subject='+encodeURIComponent(T.reportSubject(title,bar))+'&body='+encodeURIComponent(T.reportBody(title,bar,currentFile,$('#summary').textContent));
 location.href=url;};
api.playerPositionChanged.on(()=>{const b=currentBar(); $('#bmadd').textContent=T.bookmarkAdd(b); $('#report').textContent=T.report(b);});

// ---- Keyboard: space always toggles playback, whatever was clicked last ----
const typing=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['range','checkbox'].includes(el.type)));
document.addEventListener('keydown',e=>{
 if(typing(e.target)) return;
 const onControl=e.target&&['INPUT','SELECT'].includes(e.target.tagName);
 if(e.code==='Space'){ e.preventDefault(); if(e.target&&e.target.blur) e.target.blur(); api.playPause(); }
 else if(e.code==='Home'){ e.preventDefault(); api.tickPosition=0; api.scrollToCursor(); }
 else if(!onControl&&e.code==='ArrowLeft'){ e.preventDefault(); gotoBar(Math.max(1,currentBar()-1)); }
 else if(!onControl&&e.code==='ArrowRight'){ e.preventDefault(); gotoBar(currentBar()+1); }
});
// a focused button would still fire its click on keyup after a space
document.addEventListener('keyup',e=>{ if(e.code==='Space'&&!typing(e.target)) e.preventDefault(); });
document.addEventListener('click',e=>{ if(e.target&&e.target.tagName==='BUTTON') e.target.blur(); });

// ---- Mixer UI ----
function paint(){
 document.querySelectorAll('.track').forEach((d,i)=>{
  d.querySelector('[data-a=solo]').classList.toggle('on',mix.solo[i]);
  d.querySelector('[data-a=mute]').classList.toggle('on',mix.mute[i]);
  d.querySelector('[data-a=focus]').classList.toggle('on',mix.vol[i]===1&&mix.vol.some(v=>v<1));
  ['L','C','R'].forEach(k=>d.querySelector(`[data-a=${k}]`).classList.toggle('on',mix.pan[i]==={L:0,C:8,R:16}[k]));
  d.querySelector('[data-a=vol]').value=Math.round(mix.vol[i]*100);
 });
 const n=i=>score.tracks[i].name;
 const parts=[];
 const solo=mix.solo.map((s,i)=>s?n(i):null).filter(Boolean); if(solo.length)parts.push(T.sumSolo+solo.join(', '));
 const mute=mix.mute.map((s,i)=>s?n(i):null).filter(Boolean); if(mute.length)parts.push(T.sumMute+mute.join(', '));
 const low=mix.vol.map((v,i)=>v<1?`${n(i)} ${Math.round(v*100)}%`:null).filter(Boolean); if(low.length)parts.push(T.sumDamped+low.join(', '));
 const pan=mix.pan.map((p,i)=>p!==8?`${n(i)} ${p<8?T.panLeft:T.panRight}`:null).filter(Boolean); if(pan.length)parts.push(T.sumPan+pan.join(', '));
 $('#summary').textContent=parts.length?parts.join(' · '):T.sumNeutral;
}
function renderTracks(){
 const box=$('#tracks');box.innerHTML='<p id="pos"></p>';
 score.tracks.forEach((t,i)=>{
  const d=document.createElement('div');d.className='track';
  d.innerHTML=`<b>${t.name||T.part(i+1)}</b>
   <button data-a="solo">${T.solo}</button><button data-a="mute">${T.mute}</button>
   <button data-a="focus">${T.focus}</button><br>
   ${T.pan} <button data-a="L">${T.left}</button><button data-a="C">${T.center}</button><button data-a="R">${T.right}</button><br>
   ${T.volume} <input type="range" min="0" max="100" value="100" data-a="vol">`;
  d.onclick=ev=>{const a=ev.target.dataset.a;if(!a||a==='vol')return;
   if(a==='solo'){mix.solo[i]=!mix.solo[i];}
   if(a==='mute'){mix.mute[i]=!mix.mute[i];}
   if(a==='focus'){const on=!(mix.vol[i]===1&&mix.vol.some(v=>v<1)); mix.vol=mix.vol.map((v,j)=>on?(j===i?1:0.25):1);}
   if(a==='L'||a==='C'||a==='R'){const me={L:0,C:8,R:16}[a]; mix.pan=mix.pan.map((p,j)=>j===i?me:16-me); regenerate(); return;}
   applyMix();
  };
  d.oninput=ev=>{if(ev.target.dataset.a==='vol'){mix.vol[i]=ev.target.value/100;applyMix();}};
  box.appendChild(d);
 });
 paint();
}
</script></body></html>
