# Second instance of the player, at https://thornblad.com/korspelare/<token>/
# No login: the secret link is the only way in. Without the token the path does not
# exist, so https://thornblad.com/korspelare/ answers whatever the main site answers (404).
#
#   echo "Define KORSPELARE_SECRET $(openssl rand -hex 16)" | sudo tee /etc/apache2/korspelare-secret.conf
#   sudo cp korspelare-thornblad.conf /etc/apache2/
#   sudo a2enmod headers deflate
#
# Then in the thornblad.com site files (both the :80 one and certbot's -le-ssl copy):
#   at the top of the file, outside <VirtualHost>:   Include /etc/apache2/korspelare-secret.conf
#   inside <VirtualHost>:                            Include /etc/apache2/korspelare-thornblad.conf
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# /var/www/korspelare must not sit inside the thornblad.com DocumentRoot, or the
# files are reachable without the token. Change the token and reload to revoke the link.

Alias /korspelare/${KORSPELARE_SECRET}/ /var/www/korspelare/
RedirectMatch 302 ^/korspelare/${KORSPELARE_SECRET}$ /korspelare/${KORSPELARE_SECRET}/

<Directory /var/www/korspelare>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
</Directory>

<LocationMatch "^/korspelare/">
    # the token must not leak to other sites through the Referer header
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
</LocationMatch>
# the alphaTab bundle, font and soundfont change only with a new alphaTab version
<LocationMatch "^/korspelare/${KORSPELARE_SECRET}/vendor/">
    Header set Cache-Control "public, max-age=2592000"
</LocationMatch>
# scores and the library index change with every sync
<LocationMatch "^/korspelare/${KORSPELARE_SECRET}/(noter/|library\.json|index\.html|$)">
    Header set Cache-Control "no-cache"
</LocationMatch>

AddOutputFilterByType DEFLATE text/html text/plain application/javascript application/json application/xml
