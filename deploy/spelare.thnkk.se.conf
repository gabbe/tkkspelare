# Apache site for the choir player. Debian: /etc/apache2/sites-available/spelare.thnkk.se.conf
#
#   sudo a2enmod headers deflate
#   sudo htpasswd -c /etc/apache2/tkkspelare.htpasswd kammarkoren     # the shared login
#   echo "Define TKK_SECRET $(openssl rand -hex 16)" | sudo tee /etc/apache2/tkkspelare-secret.conf
#   sudo a2ensite spelare.thnkk.se && sudo systemctl reload apache2
#   sudo certbot --apache -d spelare.thnkk.se                          # adds the :443 site and the redirect
#
# Everything, including the big alphaTab bundle, sits behind the same basic auth.
# Note for Apache 2.4: do NOT add "Require all granted" next to "Require valid-user";
# several Require lines in one block combine as "any", which would switch the login off.
#
# Secret link: https://spelare.thnkk.se/<TKK_SECRET>/ serves the same site without the
# login, for singers who struggle with the password dialog. The token lives only on the
# server (tkkspelare-secret.conf, never in git); change it and reload to revoke the link.
# All app URLs are relative, so the player works unchanged under the prefix.

Include /etc/apache2/tkkspelare-secret.conf

<VirtualHost *:80>
    ServerName spelare.thnkk.se
    DocumentRoot /var/www/tkkspelare

    <Directory /var/www/tkkspelare>
        Options -Indexes -MultiViews
        AllowOverride None
        AuthType Basic
        AuthName "Trollhättans Kammarkör"
        AuthUserFile /etc/apache2/tkkspelare.htpasswd
        Require valid-user
    </Directory>

    Alias /${TKK_SECRET}/ /var/www/tkkspelare/
    RedirectMatch 302 ^/${TKK_SECRET}$ /${TKK_SECRET}/
    # a Location section is merged after Directory and replaces its Require
    <Location /${TKK_SECRET}/>
        Require all granted
    </Location>
    # the token must not leak to other sites through the Referer header
    Header always set Referrer-Policy "no-referrer"

    # keep search engines out even if they get past the login somehow
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    # the alphaTab bundle, font and soundfont change only with a new alphaTab version
    <LocationMatch "^/(${TKK_SECRET}/)?vendor/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>
    # scores and the library index change with every sync
    <LocationMatch "^/(${TKK_SECRET}/)?(noter/|library\.json|index\.html|$)">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/plain application/javascript application/json application/xml

    ErrorLog ${APACHE_LOG_DIR}/spelare-error.log
    CustomLog ${APACHE_LOG_DIR}/spelare-access.log combined
</VirtualHost>
